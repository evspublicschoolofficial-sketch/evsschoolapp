<body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-400 selection:text-slate-950 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SPREADSHEET_ID = "1AHQowKTK_xrPHTzH85nR3Hm3PsL6J5F7_KTZ7QytERU";
    const API_URL = "https://script.google.com/macros/s/AKfycbzrASF0ip3AsJI-JwgPzXSgUcTphOp3GAMiPGH4sa3iN2pkqGvJaVEDq-uwkgX9xrUuCQ/exec";

    // Standard class mapping dictionary
    const DEFAULT_CLASS_MAP = {
      'c1': '1st', 'c2': '2nd', 'c3': '3rd', 'c4': '4th', 'c5': '5th',
      'c6': '6th', 'c7': '7th', 'c8': '8th', 'c9': '9th', 'c10': '10th',
      'c11': '11th', 'c12': '12th', 'lkg': 'L.K.G', 'ukg': 'U.K.G',
      'nursery': 'Nursery', 'pre-nursery': 'Pre-Nursery',
    };

    const getClassName = (code) => {
      if (!code) return 'All';
      const clean = String(code).trim().toLowerCase();
      return DEFAULT_CLASS_MAP[clean] || code;
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return 'N/A';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        return d.toLocaleDateString('hi-IN', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch {
        return String(dateStr);
      }
    };

    // Robust Google Sheets GViz Fetcher
    async function fetchGVizSheet(sheetName) {
      try {
        const encoded = encodeURIComponent(sheetName);
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encoded}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const text = await res.text();
        const start = text.indexOf('{');
        const end = text.lastIndexOf('}');
        if (start === -1 || end === -1) return null;
        const parsed = JSON.parse(text.substring(start, end + 1));
        const cols = parsed.table?.cols || [];
        const rows = parsed.table?.rows || [];
        
        const colNames = cols.map((c, idx) => {
          let label = (c?.label || '').trim();
          if (!label) label = `col_${idx}`;
          return label;
        });

        const items = [];
        for (const row of rows) {
          if (!row.c) continue;
          const item = {};
          let hasVal = false;
          colNames.forEach((name, i) => {
            const cell = row.c[i];
            let val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
            if (val === null || val === undefined) val = '';
            item[name] = val;
            if (String(val).trim() !== '') hasVal = true;
          });
          if (hasVal) items.push(item);
        }
        return items;
      } catch (err) {
        console.warn('GViz fetch error for sheet:', sheetName, err);
        return null;
      }
    }

    // Extract photos and PDFs attached to Homework
    function extractHomeworkMedia(hw) {
      const items = [];
      const processField = (val, title, labelHindi, defaultType) => {
        if (!val) return;
        const str = String(val).trim();
        if (!str || str === 'undefined' || str === 'null' || str === '—') return;

        const lower = str.toLowerCase();
        const isPdf = lower.includes('.pdf');
        const isImg = lower.includes('.jpg') || lower.includes('.jpeg') || lower.includes('.png') || lower.includes('.webp');
        const type = isPdf && !isImg ? 'pdf' : defaultType;
        const fileName = str.split('/').pop() || str;

        // 1. Google Drive Link
        const driveMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) {
          const fileId = driveMatch[1];
          if (type === 'image') {
            items.push({
              id: `${hw.Homework_ID || Math.random()}-${title}`,
              type: 'image',
              title,
              labelHindi,
              fileName,
              url: `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`,
              fallbackUrl: `https://lh3.googleusercontent.com/d/${fileId}=w1200`,
              openUrl: `https://drive.google.com/file/d/${fileId}/view?usp=sharing`,
            });
          } else {
            items.push({
              id: `${hw.Homework_ID || Math.random()}-${title}`,
              type: 'pdf',
              title,
              labelHindi,
              fileName,
              url: `https://drive.google.com/file/d/${fileId}/preview`,
              fallbackUrl: `https://docs.google.com/viewer?url=${encodeURIComponent(`https://drive.google.com/file/d/${fileId}/view`)}&embedded=true`,
              openUrl: `https://drive.google.com/file/d/${fileId}/view?usp=sharing`,
            });
          }
          return;
        }

        // 2. Direct Web URL
        if (str.startsWith('http://') || str.startsWith('https://')) {
          items.push({
            id: `${hw.Homework_ID || Math.random()}-${title}`,
            type,
            title,
            labelHindi,
            fileName,
            url: type === 'pdf' ? `https://docs.google.com/viewer?url=${encodeURIComponent(str)}&embedded=true` : str,
            fallbackUrl: str,
            openUrl: str,
          });
          return;
        }

        // 3. AppSheet Relative Path or filename
        const driveSearchUrl = `https://drive.google.com/drive/search?q=${encodeURIComponent(fileName)}`;
        const appSheetUrl = `https://www.appsheet.com/template/gettablefileurl?appName=SchoolApp&tableName=Homework&fileName=${encodeURIComponent(str)}`;
        items.push({
          id: `${hw.Homework_ID || Math.random()}-${title}`,
          type,
          title,
          labelHindi,
          fileName,
          url: type === 'image' ? appSheetUrl : driveSearchUrl,
          fallbackUrl: driveSearchUrl,
          openUrl: driveSearchUrl,
        });
      };

      const findVal = (keys) => {
        for (const k of keys) {
          if (hw[k] && String(hw[k]).trim() !== '') return String(hw[k]).trim();
        }
        for (const [k, v] of Object.entries(hw)) {
          const cleanK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
          for (const cand of keys) {
            if (cleanK === cand.toLowerCase().replace(/[^a-z0-9]/g, '') && v && String(v).trim() !== '') {
              return String(v).trim();
            }
          }
        }
        return null;
      };

      const p1 = findVal(['Homework_Photo', 'Homework Photo', 'Photo_1', 'Photo', 'Image_1', 'Image', 'Homework_Image', 'File_1', 'Attachment_1', 'Attachment']);
      const p2 = findVal(['Homework_Photo_2', 'Homework Photo 2', 'Photo_2', 'Image_2', 'File_2', 'Attachment_2']);
      const pdf = findVal(['Homework_PDF', 'Homework PDF', 'PDF', 'Document', 'Homework_Doc', 'File', 'Homework_File', 'Attachment_Doc']);

      if (p1) processField(p1, 'Photo 1', 'फ़ोटो 1 (गृहकार्य पृष्ठ)', 'image');
      if (p2) processField(p2, 'Photo 2', 'फ़ोटो 2 (अतिरिक्त कार्य)', 'image');
      if (pdf) processField(pdf, 'Homework Document', 'गृहकार्य PDF दस्तावेज़', 'pdf');

      return items;
    }

    // Interactive Media Attachment Component for Standalone Portal
    function HomeworkMediaCard({ item, onOpen }) {
      const [loadFailed, setLoadFailed] = useState(false);

      if (item.type === 'pdf') {
        return (
          <div
            onClick={onOpen}
            className="group flex items-center justify-between p-2.5 rounded-xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100/80 hover:border-rose-300 transition-all cursor-pointer shadow-2xs"
          >
            <div className="flex items-center gap-2.5 min-w-0 pr-2">
              <div className="w-8 h-8 rounded-lg bg-rose-600 text-white flex items-center justify-center text-sm shadow-xs shrink-0 group-hover:scale-105 transition-transform">
                <i className="fa-solid fa-file-pdf"></i>
              </div>
              <div className="min-w-0">
                <p className="text-xs font-bold text-rose-950 truncate">{item.labelHindi}</p>
                <p className="text-[10px] text-rose-700 truncate">{item.fileName}</p>
              </div>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  onOpen();
                }}
                className="px-2.5 py-1 rounded-lg bg-white text-rose-700 hover:bg-rose-600 hover:text-white border border-rose-300 text-[11px] font-bold transition-all flex items-center gap-1 shadow-2xs cursor-pointer"
              >
                <i className="fa-solid fa-eye text-[10px]"></i>
                <span>PDF पढ़ें</span>
              </button>
              <a
                href={item.openUrl}
                target="_blank"
                rel="noopener noreferrer"
                onClick={(e) => e.stopPropagation()}
                className="px-2 py-1 rounded-lg bg-rose-600 text-white hover:bg-rose-700 text-[11px] font-bold transition-all flex items-center gap-1 shadow-2xs cursor-pointer"
                title="सीधे नए टैब / Google Drive में खोलें"
              >
                <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                <span>खोलें</span>
              </a>
            </div>
          </div>
        );
      }

      // Image Attachment Card
      return (
        <div
          onClick={onOpen}
          className="group flex items-center justify-between p-2.5 rounded-xl border border-blue-200 bg-blue-50/70 hover:bg-blue-100/80 hover:border-blue-300 transition-all cursor-pointer shadow-2xs"
        >
          <div className="flex items-center gap-2.5 min-w-0 pr-2">
            <div className="relative w-10 h-10 rounded-lg overflow-hidden border border-blue-300/80 bg-white shrink-0 flex items-center justify-center shadow-2xs">
              {!loadFailed && item.url ? (
                <img
                  src={item.url}
                  alt={item.title}
                  className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-200"
                  onError={() => setLoadFailed(true)}
                  loading="lazy"
                />
              ) : (
                <i className="fa-solid fa-image text-blue-900 text-lg"></i>
              )}
              <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                <i className="fa-solid fa-magnifying-glass-plus text-white text-xs"></i>
              </div>
            </div>
            <div className="min-w-0">
              <p className="text-xs font-bold text-blue-950 truncate">{item.labelHindi}</p>
              <p className="text-[10px] text-blue-700 truncate">{item.fileName}</p>
            </div>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                onOpen();
              }}
              className="px-2.5 py-1 rounded-lg bg-white text-blue-900 hover:bg-blue-900 hover:text-white border border-blue-300 text-[11px] font-bold transition-all flex items-center gap-1 shadow-2xs cursor-pointer"
            >
              <i className="fa-solid fa-expand text-[10px]"></i>
              <span>फ़ोटो देखें</span>
            </button>
            <a
              href={item.openUrl}
              target="_blank"
              rel="noopener noreferrer"
              onClick={(e) => e.stopPropagation()}
              className="px-2 py-1 rounded-lg bg-[#0c2340] text-amber-300 hover:bg-blue-950 text-[11px] font-bold transition-all flex items-center gap-1 shadow-2xs cursor-pointer"
              title="सीधे नए टैब / Google Drive में खोलें"
            >
              <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              <span>खोलें</span>
            </a>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('parent'); // Default to parent portal
      const [students, setStudents] = useState([]);
      const [homeworkList, setHomeworkList] = useState([]);
      const [trackerList, setTrackerList] = useState([]);
      const [behaviorList, setBehaviorList] = useState([]);
      const [feeList, setFeeList] = useState([]);
      const [loadingData, setLoadingData] = useState(false);
      const [apiError, setApiError] = useState(null);

      // Parent Portal State
      const [parentMobileInput, setParentMobileInput] = useState('');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [parentChildren, setParentChildren] = useState([]);
      const [parentLoggedIn, setParentLoggedIn] = useState(false);
      const [parentSearchAttempted, setParentSearchAttempted] = useState(false);
      const [parentActiveSection, setParentActiveSection] = useState('overview'); // 'overview' | 'homework' | 'tracker' | 'fees' | 'behavior' | 'profile'
      const [hwDaysFilter, setHwDaysFilter] = useState('3days');
      const [qrModalStudent, setQrModalStudent] = useState(null);

      // Lightbox Media Viewer State
      const [activeMediaModal, setActiveMediaModal] = useState(null);
      const [mediaZoom, setMediaZoom] = useState(1);
      const [mediaRotation, setMediaRotation] = useState(0);

      // Teacher State
      const [hwDate, setHwDate] = useState(new Date().toISOString().split('T')[0]);
      const [hwClass, setHwClass] = useState('C1');
      const [hwSubject, setHwSubject] = useState('Hindi');
      const [hwDetail, setHwDetail] = useState('');
      const [hwSubmitting, setHwSubmitting] = useState(false);
      const [hwSuccessMsg, setHwSuccessMsg] = useState(null);

      // Manager State
      const [managerSearch, setManagerSearch] = useState('');
      const [managerClassFilter, setManagerClassFilter] = useState('all');

      // Load all data from Google Sheets GViz and Apps Script
      const loadAllData = async () => {
        setLoadingData(true);
        setApiError(null);
        try {
          // 1. Fetch Students
          const gvizStudents = await fetchGVizSheet('Students');
          if (gvizStudents && gvizStudents.length > 0) {
            setStudents(gvizStudents);
          } else {
            const res = await fetch(`${API_URL}?action=getStudents`);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 1) {
                const hdrs = data[0];
                const list = data.slice(1).map(r => {
                  const o = {};
                  hdrs.forEach((h, i) => o[h] = r[i] || '');
                  return o;
                });
                setStudents(list);
              }
            }
          }

          // 2. Fetch Homework
          const gvizHw = await fetchGVizSheet('Homework');
          if (gvizHw && gvizHw.length > 0) {
            setHomeworkList(gvizHw);
          } else {
            const res = await fetch(`${API_URL}?action=getHomework`);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 1) {
                const hdrs = data[0];
                const list = data.slice(1).map(r => {
                  const o = {};
                  hdrs.forEach((h, i) => o[h] = r[i] || '');
                  return o;
                });
                setHomeworkList(list);
              }
            }
          }

          // 3. Fetch Homework Tracker
          const gvizTracker = await fetchGVizSheet('Homework_Tracker');
          if (gvizTracker) setTrackerList(gvizTracker);

          // 4. Fetch Student Behavior
          const gvizBehavior = await fetchGVizSheet('Student_Behavior');
          if (gvizBehavior) setBehaviorList(gvizBehavior);

          // 5. Fetch Fee Collection
          const gvizFees = await fetchGVizSheet('Fee_Collection');
          if (gvizFees) setFeeList(gvizFees);

        } catch (err) {
          console.error('Data load error:', err);
          setApiError('Google Sheets से डेटा लोड करने में त्रुटि। कृपया पुनः प्रयास करें।');
        } finally {
          setLoadingData(false);
        }
      };

      useEffect(() => {
        loadAllData();
      }, []);

      // Parent Login Handler
      const handleParentLogin = (e) => {
        if (e) e.preventDefault();
        setParentSearchAttempted(true);
        const clean = parentMobileInput.trim().replace(/\D/g, '');
        if (!clean) return;

        const matched = students.filter(s => {
          const m = String(s.Parent_Mobile || '').replace(/\D/g, '');
          return m === clean || (m.length >= 10 && m.endsWith(clean)) || (clean.length >= 10 && clean.endsWith(m));
        });

        if (matched.length > 0) {
          setParentChildren(matched);
          setSelectedStudent(matched[0]);
          setParentLoggedIn(true);
          setParentActiveSection('overview');
        } else {
          setParentChildren([]);
          setSelectedStudent(null);
          setParentLoggedIn(false);
        }
      };

      // Filtered Homework for selected student
      const parentHomework = useMemo(() => {
        if (!selectedStudent) return [];
        const studentId = String(selectedStudent.Student_ID || '').trim().toLowerCase();
        const studentClass = String(selectedStudent.Class || '').trim().toLowerCase();

        return homeworkList.filter(hw => {
          const hwStudentId = String(hw.Student_ID || '').trim().toLowerCase();
          const hwClass = String(hw.Class || '').trim().toLowerCase();
          const isTargetStudent = hwStudentId && hwStudentId === studentId;
          const isClassMatch = hwClass && (hwClass === studentClass || studentClass.includes(hwClass));
          const isAll = !hwClass || hwClass === 'all' || (hw.Target_Type && hw.Target_Type.toLowerCase().includes('poori'));
          return isTargetStudent || isClassMatch || isAll;
        }).sort((a, b) => new Date(b.Date || 0) - new Date(a.Date || 0));
      }, [selectedStudent, homeworkList]);

      // Last 3 days filtered homework
      const displayHomework = useMemo(() => {
        if (hwDaysFilter === 'all') return parentHomework;
        const now = new Date();
        const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 3).getTime();
        return parentHomework.filter(hw => {
          if (!hw.Date) return true;
          return new Date(hw.Date).getTime() >= cutoff;
        });
      }, [parentHomework, hwDaysFilter]);

      // Filtered Tracker for selected student
      const studentTracker = useMemo(() => {
        if (!selectedStudent) return [];
        const sId = String(selectedStudent.Student_ID || '').trim().toLowerCase();
        return trackerList.filter(t => String(t.Student_ID || '').trim().toLowerCase() === sId);
      }, [selectedStudent, trackerList]);

      const trackerStats = useMemo(() => {
        const completed = studentTracker.filter(t => String(t.Status || '').toLowerCase().includes('complete') && !String(t.Status || '').toLowerCase().includes('in')).length;
        const incompleted = studentTracker.filter(t => String(t.Status || '').toLowerCase().includes('incomplete') || String(t.Status || '').toLowerCase().includes('pending')).length;
        return { completed, incompleted, total: studentTracker.length };
      }, [studentTracker]);

      // Filtered Behavior for selected student
      const studentBehavior = useMemo(() => {
        if (!selectedStudent) return [];
        const sId = String(selectedStudent.Student_ID || '').trim().toLowerCase();
        return behaviorList.filter(b => String(b.Student_ID || '').trim().toLowerCase() === sId)
          .sort((a, b) => new Date(b.Date || 0) - new Date(a.Date || 0));
      }, [selectedStudent, behaviorList]);

      // Filtered Fees for selected student
      const studentFees = useMemo(() => {
        if (!selectedStudent) return { records: [], totalPaid: 0, balance: 0, hasDues: false };
        const sId = String(selectedStudent.Student_ID || '').trim().toLowerCase();
        const records = feeList.filter(f => String(f.Student_ID || '').trim().toLowerCase() === sId)
          .sort((a, b) => new Date(b.Payment_Date || b.Date || 0) - new Date(a.Payment_Date || a.Date || 0));
        
        let totalPaid = 0;
        let balance = 0;
        records.forEach(r => {
          totalPaid += parseFloat(r.Paid_Amount || r.Amount_Paid || 0) || 0;
          const bal = parseFloat(r.Balance_Amount || r.Balance || 0);
          if (!isNaN(bal) && bal > balance) balance = bal;
        });

        return {
          records,
          totalPaid,
          balance,
          hasDues: balance > 0
        };
      }, [selectedStudent, feeList]);

      // Teacher Homework Submit
      const handleTeacherSubmit = async (e) => {
        e.preventDefault();
        if (!hwDetail.trim()) return;
        setHwSubmitting(true);
        setHwSuccessMsg(null);
        try {
          const newHw = {
            Homework_ID: 'HW-' + Date.now(),
            Date: hwDate,
            Class: hwClass,
            Subject: hwSubject,
            Homework_Detail: hwDetail.trim(),
            Teacher: 'Faculty',
            Target_Type: 'Whole Class',
          };
          setHomeworkList(prev => [newHw, ...prev]);
          setHwSuccessMsg(`गृहकार्य (${hwSubject} - Class ${getClassName(hwClass)}) सफलतापूर्वक जोड़ दिया गया!`);
          setHwDetail('');
        } catch (err) {
          console.error(err);
        } finally {
          setHwSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Global Header */}
          <header className="bg-[#0c2340] text-white shadow-md sticky top-0 z-40 border-b-2 border-amber-400">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center text-lg font-black shadow-sm">
                  <i className="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-tight leading-tight flex items-center gap-2">
                    <span>E.V.S. PUBLIC SCHOOL</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-md bg-amber-400/20 text-amber-300 font-bold border border-amber-400/30">
                      वेब पोर्टल
                    </span>

                  {/* Quick Subject Pills */}
                  <div className="flex flex-wrap items-center gap-1.5 pt-1">
                    <span className="text-[11px] font-bold text-slate-400 mr-1">त्वरित विषय:</span>
                    {['Hindi', 'English', 'Mathematics', 'Science', 'Social Studies', 'Sanskrit', 'EVS', 'Computer', 'Drawing'].map((sub) => (
                      <button
                        key={sub}
                        type="button"
                        onClick={() => setHwSubject(sub)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-semibold border transition-all cursor-pointer ${
                          hwSubject === sub ? 'bg-[#0c2340] text-amber-300 border-[#0c2340]' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {sub}
                      </button>
                    ))}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">गृहकार्य विवरण (Homework Instructions)</label>
                    <textarea
                      rows="4"
                      value={hwDetail}
                      onChange={(e) => setHwDetail(e.target.value)}
                      placeholder="आज का गृहकार्य विस्तार से यहाँ लिखें... (जैसे: पाठ 3 के प्रश्न 1 से 5 कॉपी में करें व याद करें)"
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-[#0c2340]"
                      required
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={hwSubmitting}
                    className="w-full py-3 bg-[#0c2340] hover:bg-blue-950 text-amber-300 font-black rounded-xl text-sm transition-all shadow-md active:scale-95 cursor-pointer flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-paper-plane"></i>
                    <span>{hwSubmitting ? 'अपलोड हो रहा है...' : 'गृहकार्य प्रकाशित करें (Publish Homework)'}</span>
                  </button>
                </form>
              </div>
            )}

            {/* MANAGER DASHBOARD */}
            {activeTab === 'manager' && (
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                  <div>
                    <h2 className="text-lg sm:text-xl font-black text-[#0c2340] flex items-center gap-2">
                      <i className="fa-solid fa-gauge-high text-amber-500"></i>
                      <span>प्रबंधन नियंत्रण कक्ष (School Manager Overview)</span>
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      कुल पंजीकृत छात्र: <strong>{students.length}</strong> | कुल गृहकार्य रिकॉर्ड्स: <strong>{homeworkList.length}</strong>
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={managerSearch}
                      onChange={(e) => setManagerSearch(e.target.value)}
                      placeholder="नाम या मोबाइल से खोजें..."
                      className="p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold focus:outline-none"
                    />
                    <select
                      value={managerClassFilter}
                      onChange={(e) => setManagerClassFilter(e.target.value)}
                      className="p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold"
                    >
                      <option value="all">सभी कक्षाएं</option>
                      {['Pre-Nursery', 'Nursery', 'LKG', 'UKG', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9', 'C10', 'C11', 'C12'].map((c) => (
                        <option key={c} value={c}>{getClassName(c)}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-[#0c2340] text-amber-300">
                      <tr>
                        <th className="p-3 rounded-l-xl">प्रवेश सं</th>
                        <th className="p-3">छात्र का नाम</th>
                        <th className="p-3">कक्षा</th>
                        <th className="p-3">पिता का नाम</th>
                        <th className="p-3">अभिभावक मोबाइल</th>
                        <th className="p-3 rounded-r-xl">कार्य</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {students
                        .filter(s => {
                          const matchQuery = !managerSearch || 
                            String(s.Student_Name || '').toLowerCase().includes(managerSearch.toLowerCase()) ||
                            String(s.Parent_Mobile || '').includes(managerSearch);
                          const matchClass = managerClassFilter === 'all' || String(s.Class || '').toLowerCase() === managerClassFilter.toLowerCase();
                          return matchQuery && matchClass;
                        })
                        .slice(0, 50)
                        .map((s, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="p-3 font-mono font-bold text-slate-700">{s.Admission_Number || s.Student_ID}</td>
                            <td className="p-3 font-bold text-slate-900">{s.Student_Name}</td>
                            <td className="p-3 font-bold text-blue-900">{getClassName(s.Class)}</td>
                            <td className="p-3 text-slate-600">{s.Father_Name}</td>
                            <td className="p-3 font-mono text-slate-700">{s.Parent_Mobile}</td>
                            <td className="p-3">
                              <button
                                type="button"
                                onClick={() => {
                                  setSelectedStudent(s);
                                  setParentLoggedIn(true);
                                  setActiveTab('parent');
                                  setParentActiveSection('overview');
                                }}
                                className="px-2.5 py-1 bg-[#0c2340] text-amber-300 rounded-lg text-xs font-bold hover:bg-blue-950 cursor-pointer"
                              >
                                देखें →
                              </button>
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* LIGHTBOX MEDIA VIEWER MODAL (FOR PHOTOS AND PDF DOCUMENTS) */}
          {activeMediaModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/85 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 text-white rounded-3xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl border border-slate-700 overflow-hidden">
                {/* Modal Header */}
                <div className="p-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <span className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm shrink-0 ${
                      activeMediaModal.type === 'pdf' ? 'bg-rose-600 text-white' : 'bg-blue-600 text-white'
                    }`}>
                      <i className={`fa-solid ${activeMediaModal.type === 'pdf' ? 'fa-file-pdf' : 'fa-image'}`}></i>
                    </span>
                    <div className="min-w-0">
                      <p className="text-xs sm:text-sm font-black truncate">{activeMediaModal.labelHindi}</p>
                      <p className="text-[10px] text-slate-400 truncate">{activeMediaModal.fileName}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-1.5 shrink-0">
                    {/* ZOOM CONTROLS FOR IMAGES */}
                    {activeMediaModal.type === 'image' && (
                      <div className="hidden sm:flex items-center gap-1 bg-white/10 p-1 rounded-xl">
                        <button
                          type="button"
                          onClick={() => setMediaZoom(z => Math.max(0.5, z - 0.25))}
                          className="w-7 h-7 rounded-lg hover:bg-white/20 text-xs flex items-center justify-center"
                        >
                          <i className="fa-solid fa-minus"></i>
                        </button>
                        <span className="text-[10px] font-mono w-10 text-center">{Math.round(mediaZoom * 100)}%</span>
                        <button
                          type="button"
                          onClick={() => setMediaZoom(z => Math.min(3, z + 0.25))}
                          className="w-7 h-7 rounded-lg hover:bg-white/20 text-xs flex items-center justify-center"
                        >
                          <i className="fa-solid fa-plus"></i>
                        </button>
                        <button
                          type="button"
                          onClick={() => setMediaRotation(r => (r + 90) % 360)}
                          className="w-7 h-7 rounded-lg hover:bg-white/20 text-xs flex items-center justify-center"
                        >
                          <i className="fa-solid fa-rotate-right"></i>
                        </button>
                      </div>
                    )}

                    {/* DIRECT OPEN IN NEW TAB / GOOGLE DRIVE BUTTON */}
                    <a
                      href={activeMediaModal.openUrl || activeMediaModal.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs flex items-center gap-1.5 shadow-sm"
                    >
                      <i className="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                      <span>सीधे खोलें / डाउनलोड</span>
                    </a>

                    <button
                      type="button"
                      onClick={() => setActiveMediaModal(null)}
                      className="w-8 h-8 rounded-xl bg-white/10 hover:bg-rose-600 text-white flex items-center justify-center text-sm font-black transition-colors ml-1 cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="flex-1 overflow-auto p-4 flex items-center justify-center bg-slate-950 min-h-[55vh] max-h-[75vh]">
                  {activeMediaModal.type === 'image' ? (
                    <div className="flex flex-col items-center justify-center w-full h-full">
                      <img
                        src={activeMediaModal.url}
                        alt={activeMediaModal.title}
                        style={{
                          transform: `scale(${mediaZoom}) rotate(${mediaRotation}deg)`,
                          transformOrigin: 'center center',
                          transition: 'transform 0.15s ease-out',
                        }}
                        className="max-h-[60vh] max-w-full object-contain rounded-xl shadow-xl"
                        onError={(e) => {
                          const target = e.currentTarget;
                          if (activeMediaModal.fallbackUrl && target.src !== activeMediaModal.fallbackUrl) {
                            target.src = activeMediaModal.fallbackUrl;
                          } else {
                            target.style.display = 'none';
                            const errBox = document.getElementById('standalone-media-err');
                            if (errBox) errBox.style.display = 'block';
                          }
                        }}
                      />
                      <div id="standalone-media-err" style={{ display: 'none' }} className="p-6 bg-slate-900 border border-slate-700 rounded-2xl text-center max-w-md space-y-3">
                        <i className="fa-solid fa-cloud text-amber-400 text-3xl"></i>
                        <h5 className="font-bold text-sm text-white">Google Drive / AppSheet सुरक्षित फ़ोटो</h5>
                        <p className="text-xs text-slate-300">
                          इस फ़ोटो को देखने के लिए कृपया नीचे दिए गए बटन पर क्लिक करके सीधे Google Drive में खोलें:
                        </p>
                        <a
                          href={activeMediaModal.openUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-2 px-4 py-2 bg-amber-400 text-slate-950 font-black rounded-xl text-xs shadow-md"
                        >
                          <i className="fa-solid fa-arrow-up-right-from-square"></i>
                          <span>Google Drive में फ़ोटो खोलें</span>
                        </a>
                      </div>
                    </div>
                  ) : (
                    <div className="w-full h-[65vh] flex flex-col gap-3">
                      <div className="p-3 bg-slate-900 border border-slate-700 rounded-xl flex flex-wrap items-center justify-between gap-2 shrink-0">
                        <div className="flex items-center gap-2">
                          <i className="fa-solid fa-file-pdf text-rose-500 text-lg"></i>
                          <span className="text-xs text-slate-200">
                            यदि PDF यहाँ सीधे लोड नहीं हो रही है, तो तुरंत इस बटन को दबाएं:
                          </span>
                        </div>
                        <a
                          href={activeMediaModal.openUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-3.5 py-1.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-lg text-xs flex items-center gap-1.5 shadow-sm"
                        >
                          <i className="fa-solid fa-arrow-up-right-from-square"></i>
                          <span>Google Drive में PDF खोलें</span>
                        </a>
                      </div>
                      <iframe
                        src={activeMediaModal.url}
                        className="w-full flex-1 rounded-xl bg-white border border-slate-700"
                        title={activeMediaModal.title}
                      ></iframe>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                  <span>ई.वी.एस. पब्लिक स्कूल • गृहकार्य संलग्नक दर्शक</span>
                  <button
                    type="button"
                    onClick={() => setActiveMediaModal(null)}
                    className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-lg text-xs cursor-pointer"
                  >
                    बंद करें
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* QR PASS MODAL */}
          {qrModalStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-xs animate-fadeIn">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-4 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h4 className="text-base font-black text-[#0c2340]">छात्र डिजिटल क्यूआर पास</h4>
                  <button
                    type="button"
                    onClick={() => setQrModalStudent(null)}
                    className="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                  <div className="w-16 h-16 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center text-2xl font-black mx-auto shadow-sm">
                    {qrModalStudent.Student_Name ? qrModalStudent.Student_Name.charAt(0).toUpperCase() : 'S'}
                  </div>
                  <div>
                    <h5 className="font-black text-base text-slate-900">{qrModalStudent.Student_Name}</h5>
                    <p className="text-xs font-bold text-blue-900 mt-0.5">
                      कक्षा {getClassName(qrModalStudent.Class)} | रोल नं: {qrModalStudent.Roll_Number || 'N/A'}
                    </p>
                    <p className="text-[11px] text-slate-500">प्रवेश सं: {qrModalStudent.Admission_Number}</p>
                  </div>
                  
                  {/* Dynamic QR image from Google Charts API */}
                  <div className="p-3 bg-white rounded-xl border border-slate-200 inline-block shadow-xs">
                    <img
                      src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(`EVS_STUDENT:${qrModalStudent.Admission_Number || qrModalStudent.Student_ID}:${qrModalStudent.Student_Name}`)}`}
                      alt="Student QR Pass"
                      className="w-36 h-36 mx-auto object-contain"
                    />
                  </div>
                  <p className="text-[10px] text-slate-500">
                    स्कूल गेट उपस्थिति व पुस्तकालय सत्यापन हेतु
                  </p>
                </div>

                <button
                  type="button"
                  onClick={() => window.print()}
                  className="w-full py-2.5 bg-[#0c2340] text-amber-300 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm"
                >
                  <i className="fa-solid fa-print"></i>
                  <span>क्यूआर पास प्रिंट करें</span>
                </button>
              </div>
            </div>
          )}

          {/* Global Sticky Footer */}
          <footer className="bg-[#0c2340] text-slate-300 py-4 text-center text-xs border-t-2 border-amber-400 mt-auto">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>ई.वी.एस. पब्लिक स्कूल • सर्वाधिकार सुरक्षित</span>
              <span className="text-[11px] text-amber-400/90 font-semibold">
                सिंगल फ़ाइल डिजिटल पोर्टल • ऑटोमैटिक Google Sheets बैकएंड
              </span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
